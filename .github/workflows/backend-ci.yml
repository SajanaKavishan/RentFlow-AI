name: Backend CI

'on':
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend dependencies
        run: dotnet restore backend/RentFlow.Api.Tests/RentFlow.Api.Tests.csproj

      - name: Build backend API
        run: dotnet build backend/RentFlow.Api/RentFlow.Api.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test backend/RentFlow.Api.Tests/RentFlow.Api.Tests.csproj --configuration Release --no-restore --verbosity normal
